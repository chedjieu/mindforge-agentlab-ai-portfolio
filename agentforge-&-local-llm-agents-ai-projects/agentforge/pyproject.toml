[project]
name = "agentforge"
version = "0.1.0"
description = "Production-oriented local-first agentic AI platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.32.0,<1",
  "sse-starlette>=2.1.0,<4",
  "streamlit>=1.40.0,<2",
  "httpx>=0.27.0,<1",
  "requests>=2.32.0,<3",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "python-dotenv>=1.0.0,<2",
  "ollama>=0.5.0,<1",
  "langgraph>=1.0.0,<2",
  "langchain-core>=1.0.0,<2",
  "langgraph-checkpoint-sqlite>=2.0.0,<3",
  "pypdf>=5.0.0,<7",
  "chromadb>=0.5.0,<1.6",
  "numpy>=2.0.0,<3",
  "opentelemetry-api>=1.28.0,<2",
  "opentelemetry-sdk>=1.28.0,<2",
  "opentelemetry-exporter-otlp>=1.28.0,<2",
  "deepeval>=2.0.0,<3",
  "tqdm>=4.67.0,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts prepend ROOT to sys.path before importing app.*
"security/**.py" = ["E402"]
"evals/**.py" = ["E402"]
