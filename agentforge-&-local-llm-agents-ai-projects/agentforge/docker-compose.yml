services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen3}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      CHROMA_PATH: /app/data/chroma
      SQLITE_PATH: /app/data/checkpoints.db
      ASSETS_DIR: /app/assets
      STUDY_NOTE_PATH: /app/data/study_note.md
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  ui:
    build: .
    ports:
      - "8501:8501"
    environment:
      AGENTFORGE_API: http://api:8000
    depends_on:
      - api
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
