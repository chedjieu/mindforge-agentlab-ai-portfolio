[project]
name = "woka"
version = "0.1.0"
description = "Walmart OmniKnowledge AI — enterprise multi-agent knowledge OS"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.2.50,<0.3",
  "langsmith>=0.1.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.2.0",
  "pyyaml>=6.0",
  "pypdf>=5.0.0",
  "boto3>=1.35.0",
  "weaviate-client>=4.7.0,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "fpdf2>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pipelines", "evals", "security", "deploy"]

[tool.uv]
package = true
