services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Chicago
      - TZ=America/Chicago
      # FastAPI on the Windows/macOS host (from inside the container)
      - CHATBOT_API_URL=http://host.docker.internal:8000
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./data/logs:/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
