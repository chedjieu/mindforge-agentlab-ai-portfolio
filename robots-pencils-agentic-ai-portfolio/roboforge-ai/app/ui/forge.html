<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoboForge AI Console</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>RoboForge AI</h1>
    <p class="subtitle">Autonomous enterprise AI delivery — intake to delivery pack</p>
  </header>
  <section class="toolbar">
    <button type="button" id="btn-demo" class="btn-demo">Demo engagement (RetailCo / AgentCore)</button>
    <span id="toolbar-status" class="toolbar-status"></span>
  </section>
  <section id="thread-status" class="thread-status" hidden>
    <h2>Status</h2>
    <ul id="thread-list"></ul>
  </section>
  <section>
    <h2>Pending executive approvals</h2>
    <div id="pending-list"><p class="empty">No pending approvals yet.</p></div>
  </section>
  <template id="card-template">
    <article class="card" data-thread-id="">
      <h3 class="subject"></h3>
      <div class="meta domain"></div>
      <div class="meta client"></div>
      <div class="meta scores"></div>
      <div class="meta roi"></div>
      <label>Blueprint summary</label>
      <textarea class="draft-body"></textarea>
      <div class="actions">
        <button type="button" class="btn-approve">Approve</button>
        <button type="button" class="btn-edit">Save &amp; Approve Edit</button>
        <button type="button" class="btn-reject">Reject</button>
      </div>
      <div class="status"></div>
    </article>
  </template>
  <script>
    const listEl = document.getElementById("pending-list");
    const template = document.getElementById("card-template");
    const threadStatusEl = document.getElementById("thread-status");
    const threadListEl = document.getElementById("thread-list");
    const toolbarStatus = document.getElementById("toolbar-status");

    async function fetchJson(url, options) {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function renderPending(items) {
      listEl.innerHTML = "";
      if (!items.length) {
        listEl.innerHTML = '<p class="empty">No pending approvals yet.</p>';
        return;
      }
      for (const item of items) {
        const node = template.content.cloneNode(true);
        const card = node.querySelector(".card");
        const p = item.payload || {};
        const bp = p.blueprint || {};
        const scores = p.judge_scores || {};
        const roi = p.roi || {};
        card.dataset.threadId = item.thread_id;
        card.querySelector(".subject").textContent = bp.title || "Delivery blueprint";
        card.querySelector(".domain").textContent = `Domain: ${p.domain || "?"}`;
        card.querySelector(".client").textContent = `Client: ${p.client_id || "?"}`;
        card.querySelector(".scores").textContent =
          `Judges — arch ${scores.architecture ?? "n/a"}, ground ${scores.groundedness ?? "n/a"}, sec ${scores.security_compliance ?? "n/a"}, cost ${scores.cost_realism ?? "n/a"}, pass ${scores.pass ?? "n/a"}`;
        card.querySelector(".roi").textContent =
          `ROI — payback ${roi.payback_months ?? "?"} mo, annual savings $${roi.annual_savings_usd ?? "?"}`;
        card.querySelector(".draft-body").value = bp.summary || JSON.stringify(bp, null, 2);
        card.querySelector(".btn-approve").onclick = async () => {
          await fetchJson(`/approve/${item.thread_id}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "approve" }),
          });
          card.querySelector(".status").textContent = "Approved — publishing…";
        };
        card.querySelector(".btn-edit").onclick = async () => {
          await fetchJson(`/approve/${item.thread_id}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "edit", edited_body: card.querySelector(".draft-body").value }),
          });
          card.querySelector(".status").textContent = "Edited & approved…";
        };
        card.querySelector(".btn-reject").onclick = async () => {
          await fetchJson(`/approve/${item.thread_id}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "reject" }),
          });
          card.querySelector(".status").textContent = "Rejected";
        };
        listEl.appendChild(node);
      }
    }

    async function poll() {
      try {
        renderPending(await fetchJson("/pending"));
        const threads = await fetchJson("/threads");
        threadStatusEl.hidden = !threads.length;
        threadListEl.innerHTML = threads
          .map((t) => `<li><code>${t.thread_id.slice(0, 8)}</code> — ${t.status} (${t.client_id || ""})</li>`)
          .join("");
      } catch (e) {
        toolbarStatus.textContent = String(e.message || e);
      }
    }

    document.getElementById("btn-demo").onclick = async () => {
      toolbarStatus.textContent = "Submitting…";
      const res = await fetchJson("/forge/demo", { method: "POST" });
      toolbarStatus.textContent = `Thread ${res.thread_id.slice(0, 8)}…`;
      await poll();
    };

    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
