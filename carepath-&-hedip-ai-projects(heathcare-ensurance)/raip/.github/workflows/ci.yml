name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      RAIP_MODEL: fake
      RAIP_JUDGE_MODEL: fake
      RAIP_EMBEDDINGS: fake
      RAIP_HITL: evaluate
      RAIP_DATABASE_URL: sqlite:///./data/raip.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync --python 3.12 --extra dev
      - name: Ruff
        run: uv run ruff check app tests evals security scripts
      - name: Typecheck
        run: uv run mypy app tests evals security
      - name: Unit and integration tests
        run: uv run pytest
      - name: Golden evaluation
        run: uv run python -m evals.run_all
      - name: Injection evaluation
        run: uv run python -m security.injection_eval
      - name: Tenant isolation
        run: uv run pytest tests/security -q
