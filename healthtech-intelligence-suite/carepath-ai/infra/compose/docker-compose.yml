services:
  neo4j:
    image: neo4j:5
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/password
  postgres:
    image: postgres:16
    ports:
      - "5435:5432"
    environment:
      POSTGRES_PASSWORD: carepath
      POSTGRES_USER: carepath
      POSTGRES_DB: carepath
