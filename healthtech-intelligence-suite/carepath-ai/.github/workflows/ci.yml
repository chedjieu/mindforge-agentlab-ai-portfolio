name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: |
          PATHS=""
          for d in app evals security tests pipelines; do
            if [ -d "$d" ]; then PATHS="$PATHS $d"; fi
          done
          uv run ruff check $PATHS
      - name: Graph / unit tests
        run: uv run pytest -q
        env:
          CAREPATH_MODEL: fake
          CAREPATH_EMBEDDINGS: fake
          CAREPATH_JUDGE_MODEL: fake
      - name: Evals (fake)
        run: uv run python evals/run_all.py
        env:
          CAREPATH_MODEL: fake
          CAREPATH_EMBEDDINGS: fake
          CAREPATH_JUDGE_MODEL: fake
      - name: Injection gate
        run: uv run python security/injection_eval.py
        env:
          CAREPATH_MODEL: fake
          CAREPATH_EMBEDDINGS: fake
          CAREPATH_JUDGE_MODEL: fake
