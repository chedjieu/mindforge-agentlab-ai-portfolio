[project]
name = "carepath-ai"
version = "0.1.0"
description = "CarePath AI — personalized treatment plan generation with LangGraph supervisor + GraphRAG"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "langgraph>=0.2.50,<0.3",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-aws>=0.2.0",
  "langchain-google-vertexai>=2.0.0",
  "langsmith>=0.1.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]
neo4j = [
  "neo4j>=5.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
