[project]
name = "healthtech-intelligence-suite"
version = "0.1.0"
description = "Suite-root dispatcher for CarePath AI, HEDI Platform, and RAIP Engine quality gates"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals", "security"]
force-include = { "suite_runner.py" = "suite_runner.py" }

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
